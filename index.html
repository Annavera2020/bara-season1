<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Курс Бары</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg-page:#ece6d2;
    --panel-bg:#f6f1e3;
    --panel-bg-2:#ece2c9;
    --ink:#262019;
    --ink-dim:#6c6353;
    --accent:#9c5f27;
    --accent-soft:#c98a3e;
    --line:#ddd0ab;
    --stage-shadow:0 20px 46px rgba(40,35,20,.18);
    --ov-ink:#f7f1df;
    --ov-dim:rgba(247,241,223,.74);
    --ov-amber:#e6ac57;
    --ov-amber-dim:#b8813a;
    --ov-line:rgba(247,241,223,.32);
    --ov-fill:rgba(14,17,14,.5);
    --ov-fill-hover:rgba(230,172,87,.24);
  }
  :root[data-theme="dark"]{
    --bg-page:#100e0a;
    --panel-bg:#1a1611;
    --panel-bg-2:#231d15;
    --ink:#ece2cd;
    --ink-dim:#ada18a;
    --accent:#e3ab5b;
    --accent-soft:#caa065;
    --line:#33291d;
    --stage-shadow:0 20px 60px rgba(0,0,0,.55);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg-page:#100e0a;
      --panel-bg:#1a1611;
      --panel-bg-2:#231d15;
      --ink:#ece2cd;
      --ink-dim:#ada18a;
      --accent:#e3ab5b;
      --accent-soft:#caa065;
      --line:#33291d;
      --stage-shadow:0 20px 60px rgba(0,0,0,.55);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-page);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 14px;
  }

  .app{
    position:relative;
    width:min(430px, 100%);
    height:min(770px, 94vh);
    border-radius:20px;
    overflow:hidden;
    background:var(--panel-bg);
    box-shadow:var(--stage-shadow);
    isolation:isolate;
  }
  @media (min-width: 860px){
    .app{ width:min(1040px, 94vw); height:min(660px, 88vh); }
  }

  .scene{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    opacity:0;
    pointer-events:none;
    transition:opacity 420ms ease;
  }
  .scene.active{opacity:1;pointer-events:auto;}
  @media (min-width: 860px){
    .scene{ flex-direction:row; }
  }

  .hero{
    position:relative;
    flex:0 0 30%;
    min-height:150px;
    overflow:hidden;
    background:var(--panel-bg-2);
  }
  @media (min-width: 860px){
    .hero{ flex:0 0 42%; min-height:100%; }
  }
  .hero img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .hero .scrim{
    position:absolute;inset:0;
    background:
      linear-gradient(to top, rgba(6,9,8,.75) 0%, rgba(6,9,8,.15) 45%, rgba(6,9,8,.05) 60%, rgba(6,9,8,0) 75%),
      linear-gradient(to bottom, var(--panel-bg) 0%, rgba(0,0,0,0) 14%);
  }
  @media (min-width: 860px){
    .hero .scrim{
      background:
        linear-gradient(to top, rgba(6,9,8,.6) 0%, rgba(6,9,8,.08) 38%, rgba(6,9,8,0) 55%),
        linear-gradient(to right, rgba(6,9,8,0) 74%, var(--panel-bg) 100%),
        linear-gradient(to bottom, var(--panel-bg) 0%, rgba(0,0,0,0) 10%);
    }
  }
  .hero .daytag{
    position:absolute;
    left:18px;bottom:14px;right:18px;
    z-index:2;
  }
  .hero .daytag .num{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ov-amber);
    display:block;
    margin-bottom:4px;
  }
  .hero .daytag h1{
    font-family:'Newsreader', Georgia, serif;
    font-weight:600;
    font-size:26px;
    color:var(--ov-ink);
    text-shadow:0 2px 14px rgba(0,0,0,.6);
    margin:0;
    text-wrap:balance;
  }

  .topbar{
    position:absolute;
    top:14px;left:14px;right:14px;
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .leftgroup{display:flex;align-items:center;gap:10px;min-width:0;}
  .dots{display:flex;gap:5px;flex-wrap:wrap;max-width:230px;}
  .dots i{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,.3);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
    display:block;
    cursor:default;
  }
  .dots i.done{background:var(--ov-amber);}
  .dots i.now{background:var(--ov-ink);}
  .dots i.locked{opacity:.35;}
  .dots i.clickable{cursor:pointer;}

  .iconbtn{
    width:32px;height:32px;border-radius:50%;
    border:1px solid var(--ov-line);
    background:var(--ov-fill);
    color:var(--ov-ink);
    font-size:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:border-color 180ms ease, background 180ms ease;
  }
  .iconbtn:hover{border-color:var(--ov-amber);background:var(--ov-fill-hover);}
  .iconbtn[hidden]{display:none;}

  .panel{
    position:relative;
    flex:1;
    min-width:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 20px 0;
    display:flex;
    flex-direction:column;
    gap:18px;
    background:var(--panel-bg);
  }
  .panel.no-hero{padding-top:64px;}

  .kicker{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;align-items:center;gap:8px;
  }
  .kicker::before{content:"";width:14px;height:1px;background:var(--accent-soft);display:inline-block;}

  h1.pagetitle{
    font-family:'Newsreader', Georgia, serif;
    font-weight:600;
    font-size:28px;
    color:var(--ink);
    margin:0;
    text-wrap:balance;
  }
  .subtitle{
    font-family:'Newsreader', Georgia, serif;
    font-style:italic;
    font-size:15px;
    color:var(--ink-dim);
    margin-top:-10px;
  }

  p.story{
    font-family:'Newsreader', Georgia, serif;
    font-size:16.5px;
    line-height:1.62;
    color:var(--ink);
    margin:0;
  }

  section.block{
    border:1px solid var(--line);
    background:var(--panel-bg-2);
    border-radius:4px 14px 4px 14px;
    padding:14px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .block-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--accent);
  }
  .block p{
    font-family:'Karla',sans-serif;
    font-size:14.5px;
    line-height:1.55;
    color:var(--ink);
    margin:0;
  }

  label.checkline{
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--ink);
    margin-top:4px;
  }
  label.checkline input{
    width:18px;height:18px;
    accent-color:var(--accent-soft);
    margin-top:1px;
    flex:0 0 auto;
  }

  .beadrow{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin:2px 0 2px;
  }
  .bead{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--accent-soft);
    background:var(--panel-bg);
    cursor:pointer;
    transition:background 150ms ease, transform 150ms ease;
    flex:0 0 auto;
  }
  .bead.lit{
    background:var(--accent-soft);
    transform:scale(1.06);
  }
  .beadcount{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--ink-dim);
    letter-spacing:.04em;
  }
  .beadcount b{color:var(--accent);}

  section.block audio{
    width:100%;
    height:36px;
    margin-top:2px;
  }
  .audio-controls{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  button.pill{
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:12.5px;
    color:var(--ink);
    background:var(--panel-bg);
    border:1px solid var(--accent-soft);
    border-radius:999px;
    padding:8px 14px;
    cursor:pointer;
    transition:background 180ms ease, color 180ms ease;
  }
  button.pill:hover{background:var(--accent-soft);color:#1b1611;}
  button.pill:disabled{opacity:.4;cursor:default;background:var(--panel-bg);color:var(--ink);}
  .audio-note{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-dim);
    letter-spacing:.04em;
  }
  .audio-lines{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:4px;
  }
  .audio-line{
    font-family:'Newsreader', Georgia, serif;
    font-style:italic;
    font-size:14.5px;
    line-height:1.5;
    color:var(--ink-dim);
    opacity:.4;
    transition:opacity 300ms ease, color 300ms ease;
    padding-left:10px;
    border-left:2px solid transparent;
  }
  .audio-line.shown{opacity:.75;}
  .audio-line.current{
    opacity:1;
    color:var(--ink);
    border-left-color:var(--accent-soft);
  }

  .qa{display:flex;flex-direction:column;gap:5px;}
  .qa label{
    font-family:'Karla',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
  }
  .qa textarea{
    font-family:'Karla',sans-serif;
    font-size:14px;
    color:var(--ink);
    background:var(--panel-bg);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    resize:vertical;
    min-height:44px;
    line-height:1.4;
  }
  .qa textarea:focus{outline:2px solid var(--accent-soft);outline-offset:1px;}

  .footer{
    position:sticky;
    bottom:0;
    margin:8px -20px 0;
    padding:14px 20px calc(16px + env(safe-area-inset-bottom, 0px));
    background:linear-gradient(to top, var(--panel-bg) 70%, rgba(0,0,0,0));
    z-index:5;
  }
  button.next{
    width:100%;
    font-family:'Karla',sans-serif;
    font-weight:700;
    font-size:15px;
    color:#1b1611;
    background:var(--accent-soft);
    border:none;
    border-radius:999px;
    padding:13px 18px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,.18);
    transition:filter 180ms ease, opacity 180ms ease;
  }
  button.next:hover{filter:brightness(1.06);}
  button.next:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  button.ghost{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-dim);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:10px 16px;
    cursor:pointer;
    margin-top:8px;
    transition:border-color 180ms ease, color 180ms ease;
  }
  button.ghost:hover{border-color:var(--accent-soft);color:var(--accent);}

  .rule{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--ink-dim);
    border-left:2px solid var(--accent-soft);
    padding-left:10px;
    line-height:1.5;
  }

  .tracker-list{display:flex;flex-direction:column;gap:8px;}
  .tracker-row{
    display:flex;
    align-items:center;
    gap:12px;
    border:1px solid var(--line);
    background:var(--panel-bg-2);
    border-radius:4px 12px 4px 12px;
    padding:10px 12px;
    cursor:pointer;
    transition:border-color 180ms ease;
  }
  .tracker-row:hover{border-color:var(--accent-soft);}
  .tracker-row.locked{cursor:default;opacity:.5;}
  .tracker-row .badge-num{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    border:1px solid var(--accent-soft);
    color:var(--accent);
    flex:0 0 auto;
  }
  .tracker-row.done .badge-num{background:var(--accent-soft);color:#1b1611;}
  .tracker-row .tinfo{flex:1;min-width:0;}
  .tracker-row .tinfo .tname{
    font-family:'Karla',sans-serif;font-weight:700;font-size:14px;color:var(--ink);
  }
  .tracker-row .tinfo .tsub{
    font-family:'IBM Plex Mono', monospace;font-size:10px;color:var(--ink-dim);letter-spacing:.04em;
  }
  .tracker-row .tstate{font-size:16px;}

  .journal-entry{
    border-bottom:1px solid var(--line);
    padding-bottom:10px;
  }
  .journal-entry:last-child{border-bottom:none;}
  .journal-entry .jday{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
    margin-bottom:4px;
  }
  .journal-entry .janswer{
    font-family:'Newsreader', Georgia, serif;
    font-style:italic;
    font-size:14px;color:var(--ink);
    margin:0 0 2px;
  }
  .journal-empty{
    font-family:'Karla',sans-serif;
    font-size:13px;
    color:var(--ink-dim);
  }

  @media (prefers-reduced-motion: reduce){
    .scene{transition:opacity 120ms linear;}
  }
</style>

<div class="app" id="app">
  <div class="topbar" id="topbar">
    <div class="leftgroup">
      <button class="iconbtn" id="backBtn" type="button" aria-label="Назад" title="Назад" hidden>←</button>
      <div class="dots" id="dots"></div>
    </div>
    <button class="iconbtn" id="trackerBtn" type="button" aria-label="Трекер курса" title="Трекер курса">☰</button>
  </div>
</div>

    story:"Бара может часами сидеть на одном камне. Мимо проплывают рыбы, шумит лес — он не бросается ни за чем, он смотрит. Быть камнем — не значит быть равнодушным. Это значит не вскакивать на каждый раздражитель. Между стимулом и реакцией есть зазор — камень живёт именно в нём.",
    practice:"В следующей раздражающей ситуации сегодня не отвечай сразу. Досчитай до трёх про себя, прежде чем сказать слово или сделать действие — даже если ситуация мелкая.",
    audio:[
      "Сядь, как камень — устойчиво, без лишних движений.",
      "Представь, что мимо тебя течёт вода — это мысли, звуки, раздражители дня.",
      "Ты не вода. Ты камень, вокруг которого она течёт.",
      "Вспомни ситуацию сегодня, где хотелось ответить резко.",
      "Просто заметь: было раздражение — и был порыв среагировать.",
      "Между ними зазор. Побудь в этом зазоре несколько секунд.",
      "Камень не игнорирует воду. Он просто не двигается вслед за каждой волной."

    questions:[
      "Где сегодня получилось выдержать паузу перед реакцией?",

    ],
    questions:[
      "Была ли сегодня буря — большая или маленькая?",
      "Что я обычно делаю, когда накрывает — борюсь или убегаю?",

    ]
  },
  {
    n:7, key:"hare", title:"Тишина после", subtitle:"О том, что курс закончится, а ты останешься",
    story:"Последний урок Бара не объясняет — он просто перестаёт говорить. Заяц, который прибежал к источнику взвинченным, однажды замечает: он сидит рядом с Барой уже несколько минут и молчит. Не потому что нечего сказать. А потому что не нужно. «Медитация — это не про то, чтобы ничего не происходило. А про то, чтобы ты никуда не убегал, пока происходит».",

      "Сядь так же, как сидел все эти шесть дней.",

      "Вспомни камень — оставайся неподвижным ещё немного.",

    ],
    questions:[
      "Какая из семи практик прижилась сильнее остальных?",
      "Что изменилось за эту неделю — конкретно, в одном предложении?",
      "Как я буду возвращаться к этому без книги?"
    ]
  }

const COVER_TEXT = "Бамбуковый лес стоит плотной стеной, но у воды всегда тихо. Здесь, на тёплом источнике, живёт капибара по имени Бара. Он не медитирует специально — он просто такой, целиком. Эта книга — семь дней, которые Бара никогда не объяснял вслух. Он их просто показывал.";
const COVER_RULE = "Правило одно: не открывать следующий день, пока не прожит предыдущий.";
const EPILOGUE_TEXT = "Курс закончен. Чётки, листик, источник, чай, камень, буря, тишина — семь дней, ни один из которых не был просто прочитан. Бара по-прежнему сидит у источника. Он никуда не спешит — потому что ему больше некуда бежать. Ты тоже уже пришёл.";

const app = document.getElementById("app");
const dotsEl = document.getElementById("dots");
const trackerBtn = document.getElementById("trackerBtn");
const backBtn = document.getElementById("backBtn");
const built = {};
let stopAudio = null;
let currentId = null;
const navHistory = [];

function isDone(n){ return state.completed.indexOf(n) !== -1; }
function isUnlocked(n){ return n === 1 || isDone(n-1); }

function renderDots(currentId){
  dotsEl.innerHTML = "";
  if (typeof currentId !== "string" || currentId === "tracker"){ return; }
  DAYS.forEach(d => {
    const dot = document.createElement("i");
    const unlocked = isUnlocked(d.n);
    if (isDone(d.n)) dot.classList.add("done");
    if (currentId === "day"+d.n) dot.classList.add("now");
    if (!unlocked) dot.classList.add("locked");
    if (unlocked) { dot.classList.add("clickable"); dot.addEventListener("click", () => goTo("day"+d.n)); }
    dot.title = "День " + d.n + " · " + d.title;
    dotsEl.appendChild(dot);
  });
}

function stopAnyAudio(){
  if (stopAudio){ try{ stopAudio(); }catch(e){} stopAudio = null; }
}

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function buildHero(imgKey, kicker, title){
  const hero = el("div","hero");
  const img = document.createElement("img");
  img.src = IMAGES[imgKey];
  img.alt = "";
  hero.appendChild(img);
  hero.appendChild(el("div","scrim"));
  const tag = el("div","daytag");
  tag.appendChild(el("span","num", kicker));
  const h = document.createElement("h1");
  h.textContent = title;
  tag.appendChild(h);
  hero.appendChild(tag);
  return hero;
}

function buildBeadsPractice(container, onProgress){
  const wrap = el("div","");
  const row = el("div","beadrow");
  const beads = [];
  for (let i=0;i<10;i++){
    const b = el("div","bead");
    beads.push(b);
    row.appendChild(b);
  }
  const count = el("div","beadcount");
  let n = 0;
  function render(){
    beads.forEach((b,i) => b.classList.toggle("lit", i < n));
    if (n === 0) count.innerHTML = "Нажимай на бусины по одной — вдох, выдох…";
    else if (n >= 10) count.innerHTML = "<b>Готово.</b> Десять вдохов позади.";
    else count.innerHTML = (n % 2 === 1 ? "Вдох" : "Выдох") + " · <b>" + n + "</b> из 10";
    if (n >= 10 && onProgress) onProgress();
  }
  function tick(){
    n = n >= 10 ? 0 : n + 1;
    render();
  }
  beads.forEach(b => b.addEventListener("click", tick));
  render();
  wrap.appendChild(row);
  wrap.appendChild(count);
  container.appendChild(wrap);
}

function buildAudioBlock(dayN, lines){
  const block = el("section","block");
  block.appendChild(el("div","block-label","Аудио-гид"));

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  audio.src = "audio/den-" + dayN + ".mp3";
  block.appendChild(audio);
  block.appendChild(el("div","audio-note","Запись голоса — не синтез."));

  const linesWrap = el("div","audio-lines");
  lines.forEach(t => linesWrap.appendChild(el("div","audio-line shown", t)));
  block.appendChild(linesWrap);

  stopAudio = () => { try{ audio.pause(); }catch(e){} };

  return block;
}

function buildQuestions(dayN, questions){
  const block = el("section","block");
  block.appendChild(el("div","block-label","Вопросы вечера"));
  const qa = el("div","qa");
  questions.forEach((q, i) => {
    const wrap = el("div","qa");
    wrap.appendChild(el("label","",q));
    const ta = document.createElement("textarea");
    ta.rows = 2;
    const saved = (state.answers[dayN] && state.answers[dayN][i]) || "";
    ta.value = saved;
    ta.addEventListener("input", () => {
      if (!state.answers[dayN]) state.answers[dayN] = ["","",""];
      state.answers[dayN][i] = ta.value;
      saveState();
    });
    wrap.appendChild(ta);
    qa.appendChild(wrap);
  });
  block.appendChild(qa);
  return block;
}

function buildCoverScene(){
  const scene = el("div","scene");
  scene.appendChild(buildHero("cover", "Курс медитации · 7 дней", "Бара"));
  const panel = el("div","panel");
  panel.appendChild(el("p","story", COVER_TEXT));
  panel.appendChild(el("div","rule", COVER_RULE));

  const doneCount = state.completed.length;
  panel.appendChild(el("div","block-label", doneCount > 0 ? "Твоя книга · " + doneCount + " из 7 дней пройдено" : "Семь дней этой книги"));
  panel.appendChild(buildDayListBlock());

  const footer = el("div","footer");
  const btn = el("button","next");
  btn.type = "button";
  const hasProgress = doneCount > 0;
  const allDone = doneCount >= 7;
  btn.textContent = allDone ? "К эпилогу" : (hasProgress ? "Продолжить курс" : "Начать курс");
  btn.addEventListener("click", () => {
    let target = "day1";
    for (const d of DAYS){ if (!isDone(d.n)) { target = "day"+d.n; break; } if (d.n === 7) target = "epilogue"; }
    goTo(target);
  });
  footer.appendChild(btn);
  panel.appendChild(footer);
  scene.appendChild(panel);
  return scene;
}

function buildDayScene(day){
  const scene = el("div","scene");
  scene.appendChild(buildHero(day.key, "День " + day.n + " из 7 · " + day.title, day.title));

  const panel = el("div","panel");
  panel.appendChild(el("div","kicker", day.subtitle));
  panel.appendChild(el("p","story", day.story));

  const practiceBlock = el("section","block");
  practiceBlock.appendChild(el("div","block-label","Практика дня"));
  practiceBlock.appendChild(el("p","", day.practice));
  if (day.n === 1){
    buildBeadsPractice(practiceBlock, () => { /* tactile only */ });
  }
  const label = el("label","checkline");
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = isDone(day.n);
  const span = el("span","", "Я сделал(а) практику сегодня");
  label.appendChild(cb);
  label.appendChild(span);
  practiceBlock.appendChild(label);
  panel.appendChild(practiceBlock);

  panel.appendChild(buildAudioBlock(day.n, day.audio));
  panel.appendChild(buildQuestions(day.n, day.questions));

  const footer = el("div","footer");
  const nextBtn = el("button","next");
  nextBtn.type = "button";
  nextBtn.textContent = day.n === 7 ? "К эпилогу" : "День " + (day.n+1) + " →";
  nextBtn.disabled = !isDone(day.n);
  cb.addEventListener("change", () => {
    if (cb.checked){ if (!isDone(day.n)) state.completed.push(day.n); }
    else { state.completed = state.completed.filter(x => x !== day.n); }
    saveState();
    nextBtn.disabled = !isDone(day.n);
    renderDots("day"+day.n);
  });
  nextBtn.addEventListener("click", () => {
    goTo(day.n === 7 ? "epilogue" : "day"+(day.n+1));
  });
  footer.appendChild(nextBtn);
  panel.appendChild(footer);
  scene.appendChild(panel);
  return scene;
}

function buildDayListBlock(){
  const list = el("div","tracker-list");
  DAYS.forEach(d => {
    const row = el("div","tracker-row");
    const unlocked = isUnlocked(d.n);
    if (isDone(d.n)) row.classList.add("done");
    if (!unlocked) row.classList.add("locked");
    const num = el("div","badge-num", String(d.n));
    const info = el("div","tinfo");
    info.appendChild(el("div","tname", d.title));
    info.appendChild(el("div","tsub", d.subtitle));
    const stateIcon = el("div","tstate", isDone(d.n) ? "✓" : (unlocked ? "→" : "🔒"));
    row.appendChild(num);
    row.appendChild(info);
    row.appendChild(stateIcon);
    if (unlocked) row.addEventListener("click", () => goTo("day"+d.n));
    list.appendChild(row);
  });
  return list;
}

function buildTrackerScene(){
  const scene = el("div","scene");
  const panel = el("div","panel no-hero");
  panel.appendChild(el("div","kicker","Трекер курса"));
  panel.appendChild(el("h1","pagetitle","Твоя неделя"));
  const doneCount = state.completed.length;
  panel.appendChild(el("p","story", doneCount + " из 7 дней пройдено."));
  panel.appendChild(buildDayListBlock());

  if (doneCount > 0){
    const journalBlock = el("section","block");
    journalBlock.appendChild(el("div","block-label","Дневник вечера"));
    let any = false;
    DAYS.forEach(d => {
      const answers = state.answers[d.n];
      if (!answers || !answers.some(a => a && a.trim())) return;
      any = true;
      const entry = el("div","journal-entry");
      entry.appendChild(el("div","jday","День " + d.n + " · " + d.title));
      answers.forEach(a => { if (a && a.trim()) entry.appendChild(el("p","janswer", "«" + a.trim() + "»")); });
      journalBlock.appendChild(entry);
    });
    if (!any) journalBlock.appendChild(el("div","journal-empty","Пока нет записей."));
    panel.appendChild(journalBlock);
  }

  const resetBtn = el("button","ghost","Начать курс заново");
  resetBtn.type = "button";
  resetBtn.addEventListener("click", () => {
    if (confirm("Сбросить весь прогресс и записи?")){
      state = { completed: [], answers: {} };
      saveState();
      Object.keys(built).forEach(k => { built[k].remove(); delete built[k]; });
      navHistory.length = 0;
      currentId = null;
      goTo("cover");
    }
  });
  panel.appendChild(resetBtn);

  scene.appendChild(panel);
  return scene;
}

function buildEpilogueScene(){
  const scene = el("div","scene");
  scene.appendChild(buildHero("ceremony", "Эпилог", "Ты уже пришёл"));
  const panel = el("div","panel");
  panel.appendChild(el("p","story", EPILOGUE_TEXT));
  const footer = el("div","footer");
  const trackerLink = el("button","next","Открыть дневник и трекер");
  trackerLink.type = "button";
  trackerLink.addEventListener("click", () => goTo("tracker"));
  footer.appendChild(trackerLink);
  panel.appendChild(footer);
  scene.appendChild(panel);
  return scene;
}

function ensureScene(id){
  if (built[id]) return built[id];
  let node;
  if (id === "cover") node = buildCoverScene();
  else if (id === "tracker") node = buildTrackerScene();
  else if (id === "epilogue") node = buildEpilogueScene();
  else {
    const n = parseInt(id.replace("day",""), 10);
    const day = DAYS.find(d => d.n === n);
    node = buildDayScene(day);
  }
  app.appendChild(node);
  built[id] = node;
  return node;
}

function goTo(id, opts){
  opts = opts || {};
  stopAnyAudio();
  if (id !== "cover" && id !== "tracker" && id.indexOf("day") === 0){
    const n = parseInt(id.replace("day",""), 10);
    if (!isUnlocked(n)) id = "day1";
  }
  if (!opts.isBack && currentId !== null && currentId !== id){
    navHistory.push(currentId);
  }
  currentId = id;
  if (built.tracker) { built.tracker.remove(); delete built.tracker; }
  Object.values(built).forEach(node => node.classList.remove("active"));
  const node = ensureScene(id);
  requestAnimationFrame(() => node.classList.add("active"));
  renderDots(id);
  backBtn.hidden = navHistory.length === 0;
}

trackerBtn.addEventListener("click", () => goTo("tracker"));
backBtn.addEventListener("click", () => {
  if (!navHistory.length) return;
  const prev = navHistory.pop();
  goTo(prev, { isBack: true });
});

goTo("cover");
</script>
